packages:
  - packages/*

allowBuilds:
  core-js: false
  sharp: false

catalog:
  "@atproto/lex": ^0.3.14
  "@effect/platform-node": ^4.0.1
  "@effect/sql-sqlite-node": ^4.0.1
  "@effect/vitest": ^4.0.1
  effect: ^4.0.1
  oxlint: ^1.87.0
  oxlint-tsgolint: ^7.0.2004
  typescript: ^7.0.0

packageExtensions:
  # Only its type declarations import eslint; oxlint runs it as a JS plugin.
  eslint-plugin-turbo:
    peerDependenciesMeta:
      eslint:
        optional: true
