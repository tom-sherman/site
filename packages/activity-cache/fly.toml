# fly.toml app configuration file generated for tom-activity-cache on 2026-10-11T18:27:41+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# The Dockerfile needs the whole monorepo as its build context, so deploy from
# the repo root:
#
#   fly deploy --config packages/activity-cache/fly.toml
#
# It's one machine with one volume: SQLite lives on the volume, so a second
# machine would have its own database. Pass --ha=false on the first deploy so
# flyctl doesn't create a spare.

app = 'tom-activity-cache'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Must match the site's OIDC_ISSUER exactly, with no trailing slash.
  OIDC_ISSUER = 'https://site-iota-rose-87.vercel.app'
  OIDC_AUDIENCE = 'activity-cache'

[mounts]
  source = 'activity_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  # It follows Jetstream and refreshes sources in the background, which
  # doesn't count as traffic, so it mustn't be stopped when requests stop.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/status'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '1gb'
  cpus = 1
